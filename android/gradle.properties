# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enable Parallel Execution, Build Cache, and On-Demand Configuration
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX package structure
android.useAndroidX=true

# Build for both Physical Phone (arm64-v8a) and Emulator (x86_64)!
reactNativeArchitectures=arm64-v8a,x86_64
reactNativeDebugArchitectures=arm64-v8a,x86_64

# Use Hermes JS Engine
hermesEnabled=true

# Enable Edge-to-Edge display
edgeToEdgeEnabled=true

# Opt out of AGP 9 deprecation warnings
android.builtInKotlin=true
android.newDsl=false
